name: Build ATLAHS Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "vendor/atlahs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            platform: linux_x86_64
          - os: macos-13
            arch: x86_64
            platform: darwin_x86_64
          - os: macos-latest
            arch: arm64
            platform: darwin_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install re2c gengetopt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq re2c gengetopt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ATLAHS simulators
        run: python scripts/build_atlahs.py

      - name: Upload binaries (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: atlahs-binaries-${{ matrix.platform }}
          path: src/simulon/backend/atlahs_binaries/${{ matrix.platform }}/*
          if-no-files-found: error
