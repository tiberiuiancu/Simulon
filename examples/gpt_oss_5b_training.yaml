# GPT-OSS-5B (MoE) training scenario
#
# Parallelism: TP=1, PP=1, EP=4, DP=1
# Total GPUs:  1 × 1 × 4 × 1 = 4  (1 node × 4 GPUs/node)
#
# Network: standard H100 cluster
#   Scale-up:  NVLink → port_speed = 3600 Gbps
#   Scale-out: 400 Gbps InfiniBand, fat-tree

datacenter:
  datacenter:
    name: h100-4gpu
    pue: 1.3
    electricity_cost_per_kwh: 0.10   # Netherlands commercial rate (EUR)
    datacenter_lifetime_years: 5
    idle_fraction: 0.4
  cluster:
    num_nodes: 1
  node:
    gpus_per_node: 4
    gpu:
      from: h100
      cost:
        value: 25000
        min: 20000
        max: 32000
  network:
    scale_up:
      switch:
        port_speed: 3600Gbps
        latency: 0.000025ms
        power_model:
          tdp_w: 110
        cost: 3000
    scale_out:
      nic:
        speed: 100Gbps
        latency: 0.005ms
        power_model:
          tdp_w: 25
        cost: 2000
      topology:
        type: fat_tree
        params:
          k: 8

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload:
  framework: megatron
  model: gpt-oss-5b
  parallelism:
    tp: 1
    pp: 1
    ep: 4
    dp: 1
    distributed_optimizer: true
    num_microbatches: 8
  training:
    num_gpus: 4
    global_batch_size: 16   # dp=1 × mbs=1 × num_microbatches=16
    micro_batch_size: 2
    sequence_length: 8192
 
