# LLaMA-13B training on 32 GPUs (4 nodes × 8 GPUs/node)
#
# Parallelism: TP=4, PP=4, DP=2
# Total GPUs:  4 × 4 × 2 = 32
#
# TP=4 keeps tensor-parallel comms within each node over NVLink.
# PP=4 pipelines across nodes over InfiniBand.
#
# Network:
#   Scale-up:  H100 NVSwitch ~900 GB/s per GPU → 7200 Gbps port speed
#   Scale-out: 400 Gbps InfiniBand, fat-tree (k=4 → up to 32 hosts)

datacenter:
  datacenter:
    name: llama7b-32gpu-cluster
    pue: 1.3
    electricity_cost_per_kwh: 0.10   # Netherlands commercial rate (EUR)
    datacenter_lifetime_years: 5
    idle_fraction: 0.4
  cluster:
    num_nodes: 4
  node:
    gpus_per_node: 8
    gpu:
      from: h100
      cost:
        value: 25000
        min: 20000
        max: 32000
  network:
    scale_up:
      switch:
        port_speed: 7200Gbps   # H100 NVSwitch ~900 GB/s per GPU
        latency: 0.000025ms
        power_model:
          tdp_w: 110
        cost: 3000
    scale_out:
      nic:
        speed: 400Gbps
        latency: 0.005ms
        power_model:
          tdp_w: 25
        cost: 2000
      topology:
        type: fat_tree
        params:
          k: 4

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload:
  framework: megatron-deprecated
  model: llama-7b
  parallelism:
    tp: 4
    pp: 4
    dp: 2
    num_microbatches: 8
  training:
    num_gpus: 32
    global_batch_size: 1024  # dp=2 × mbs=64 × num_microbatches=8
    micro_batch_size: 64
    sequence_length: 2048
