# GPT-OSS-20B (MoE) training scenario — NEW flat-config format
#
# Parallelism: TP=1, PP=4, EP=4, DP=1
# Total GPUs:  1 × 4 × 4 × 1 = 16  (4 nodes × 4 GPUs/node)
#
# This uses the trace-driven path (framework: megatron) with a flat "config"
# dict that mirrors Megatron-LM CLI flags.  Compute durations come from real
# GPU execution traces (saved under datacenter.datacenter.traces_dir) rather
# than analytical layer expansion.
#
# Network: standard H100 cluster
#   Scale-up:  NVLink → port_speed = 3600 Gbps
#   Scale-out: 400 Gbps InfiniBand, fat-tree

datacenter:
  datacenter:
    name: h100-16gpu
    pue: 1.3
    electricity_cost_per_kwh: 0.10   # Netherlands commercial rate (EUR)
    datacenter_lifetime_years: 5
    idle_fraction: 0.4
    # traces_dir: ./traces/h100-16gpu   # ← point to directory with trace_pp_stage_*.json
  cluster:
    num_nodes: 4
  node:
    gpus_per_node: 4
    gpu:
      from: h100
      cost:
        value: 25000
        min: 20000
        max: 32000
  network:
    scale_up:
      switch:
        port_speed: 3600Gbps
        latency: 0.000025ms
        power_model:
          tdp_w: 110
        cost: 3000
    scale_out:
      nic:
        speed: 100Gbps
        latency: 0.005ms
        power_model:
          tdp_w: 25
        cost: 2000
      topology:
        type: fat_tree
        params:
          k: 8

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload:
  framework: megatron
  config:
    # Parallelism
    tensor-model-parallel-size: 1
    pipeline-model-parallel-size: 4
    expert-model-parallel-size: 4

    # Model architecture
    num-layers: 24
    hidden-size: 6144
    num-attention-heads: 32
    ffn-hidden-size: 8192
    swiglu: true
    num-experts: 8
    moe-router-topk: 2

    # Training
    micro-batch-size: 1
    global-batch-size: 16
    seq-length: 8192
    num-gpus: 16
    distributed-optimizer: true
