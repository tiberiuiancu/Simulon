# Collective validation scenario (AllReduce 4n4g, 8GiB)
# Based on experiments/validate_simccl/sim_ccl.py hardware config.
#
# Node:  Snellius H100 NVSwitch4  (4 GPUs)  — loads real nccl-tests profile
# NIC:   200 Gbps InfiniBand, 4 NICs per node, 5 µs latency
#
# Use with simulon simulate to run a single collective point:
#   simulon simulate examples/collective_validation.yaml -o trace.json
#
# Sweeping message sizes and node counts is done by sim_ccl.py.

datacenter:
  datacenter:
    name: collective-validation-4n4g
  cluster:
    num_nodes: 4
  node:
    from: snellius-h100-4g
  network:
    scale_out:
      nic:
        speed: 200Gbps
        latency: 0.005ms
        nics_per_node: 4
      topology:
        type: fat_tree
        params:
          k: 4

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload:
  framework: collective
  collective_type: AllReduce
  message_size_bytes: 8589934592
