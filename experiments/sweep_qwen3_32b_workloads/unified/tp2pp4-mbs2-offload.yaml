framework: megatron
config:
  num-gpus: 64
  tokenizer-type: NullTokenizer
  mock-data: true
  vocab-size: 262144
  padded-vocab-size: 262144
  add-bias-linear: false
  add-qkv-bias: false
  bias-gelu-fusion: false
  # CPU-OFFLOAD FOR TRACING. fake-PG runs on ONE GPU with no DP group, so the
  # distributed optimizer cannot shard Adam's fp32 moments and this config OOMs
  # (0 rank traces in every prior attempt; ~155 MiB free of 95 GiB).
  # --optimizer sgd does NOT work: Megatron asserts 'Only Adam and
  # HybridDeviceOptimizer currently supported' under use-distributed-optimizer, and
  # disabling that would switch DP from reduce-scatter+all-gather to all-reduce,
  # corrupting the comm pattern the simulator reads from the trace.
  # Offloading instead keeps Adam AND the distributed optimizer (correct collectives)
  # and moves the states to host memory. Timing impact is bounded: the optimizer runs
  # in the 'step' slot = 0.1-0.2%% of traced compute (11.9-14.0 ms of ~7900 ms).
  optimizer-cpu-offload: true
  optimizer-offload-fraction: 1.0
  # Required by Megatron: 'optimizer cpu offload must be used in conjunction with
  # --use-precision-aware-optimizer, as the hybrid device optimizer reuses that
  # code path'. Lowers optimizer-state precision, which only shrinks memory
  # further; the effect is confined to the 'step' slot (0.1-0.2%% of compute).
  use-precision-aware-optimizer: true
  data-parallel-sharding-strategy: no_shard
  tensor-model-parallel-size: 2
  pipeline-model-parallel-size: 4
  sequence-parallel: false
  micro-batch-size: 2
  global-batch-size: 256
  lr: 0.0006
  seed: 1234
  num-layers: 64
  hidden-size: 5120
  ffn-hidden-size: 25600
  init-method-std: 0.02
  seq-length: 4096
  kv-channels: 128
  max-position-embeddings: 4096
  swiglu: true
  num-attention-heads: 64
  num-query-groups: 8
  group-query-attention: true
  attention-softmax-in-fp32: true
  use-flash-attn: true
  attention-backend: auto
  position-embedding-type: rope
  rotary-base: 10000
  rotary-percent: 1.0
  untie-embeddings-and-output-weights: true
  normalization: RMSNorm
  norm-epsilon: 1.0e-05
  qk-layernorm: true
  bf16: true
  attention-dropout: 0.0
  hidden-dropout: 0.0
  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  adam-eps: 1.0e-08
  clip-grad: 1.0
  weight-decay: 0.05
  min-lr: 0.0
  lr-decay-style: WSD
  lr-wsd-decay-style: linear
  lr-warmup-iters: 0
  lr-decay-iters: 1
  lr-wsd-decay-iters: 1
  recompute-activations: false
  use-torch-fsdp2: false
  context-parallel-size: 1
  use-distributed-optimizer: true
  distributed-backend: nccl
  distributed-timeout-minutes: 30
  eval-interval: 999
  eval-iters: 0
