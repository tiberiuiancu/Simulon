framework: megatron
config:
  num-gpus: 1024
  tensor-model-parallel-size: 8
  pipeline-model-parallel-size: 2
  num-virtual-stages-per-pipeline-rank: 1
  sequence-parallel: true
  context-parallel-size: 1
  bf16: true
  cross-entropy-fusion-impl: te
  num-layers: 80
  hidden-size: 8192
  num-attention-heads: 64
  num-query-groups: 8
  ffn-hidden-size: 28672
  kv-channels: 128
  hidden-dropout: 0.0
  attention-dropout: 0.0
  disable-bias-linear: false
  normalization: RMSNorm
  share-embeddings-and-output-weights: false
  position-embedding-type: rope
  rotary-base: 500000
  seq-length: 8192
  vocab-size: 32000
  fp8-param-gather: false
  lr: 0.0003
  min-lr: 3.0e-05
  adam-beta2: 0.95
  use-distributed-optimizer: true
  grad-reduce-in-bf16: true
  overlap-grad-reduce: false
  overlap-param-gather: false
  micro-batch-size: 1
  global-batch-size: 512
  manual-gc: true
  manual-gc-interval: 100
  override-opt_param-scheduler: true
  num-workers: 8
  seed: 1234
  split: 1000,0,0
  reset-position-ids: false
  reset-attention-mask: false
  eod-mask-loss: false
  tokenizer-type: NullTokenizer
  fp8-recipe: tensorwise
  mock-data: true
  moe-token-dispatcher-type: alltoall
