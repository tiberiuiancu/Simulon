framework: megatron
config:
  num-gpus: 2
  tokenizer-type: NullTokenizer
  mock-data: true
  vocab-size: 32000
  padded-vocab-size: 32000

  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 1
  context-parallel-size: 1
  data-parallel-sharding-strategy: no_shard

  micro-batch-size: 1
  global-batch-size: 2
  lr: 0.0004
  seed: 1234

  num-layers: 4
  hidden-size: 512
  ffn-hidden-size: 512
  init-method-std: 0.02
  seq-length: 1024
  kv-channels: 64
  max-position-embeddings: 1024
  swiglu: true

  num-attention-heads: 8
  num-query-groups: 2
  group-query-attention: true
  attention-softmax-in-fp32: false
  use-flash-attn: true
  attention-backend: flash

  position-embedding-type: rope
  rotary-base: 150000
  rotary-percent: 1.0
  untie-embeddings-and-output-weights: true

  qk-layernorm: true
  normalization: RMSNorm
  norm-epsilon: 1.e-5
  bf16: true
  fp16: false

  attention-dropout: 0.0
  hidden-dropout: 0.0

  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  adam-eps: 1.e-8
  clip-grad: 1.0
  weight-decay: 0.05

  min-lr: 0.00004
  lr-decay-style: cosine
  lr-warmup-iters: 0

  recompute-activations: false
  use-torch-fsdp2: false

  use-distributed-optimizer: true
  overlap-grad-reduce: true
  overlap-param-gather: true

  distributed-backend: nccl
  distributed-timeout-minutes: 30
  eval-interval: 999
  eval-iters: 0

  num-experts: 4
  moe-router-topk: 1
  moe-router-pre-softmax: true
  moe-token-dispatcher-type: alltoall
  moe-grouped-gemm: true
  moe-permute-fusion: true
  moe-ffn-hidden-size: 512
  moe-layer-freq: 1
  moe-aux-loss-coeff: 0.0

  add_position_embedding: false
  disable-bias-linear: true
  no-bias-dropout-fusion: true
  no-rope-fusion: true
  gradient-accumulation-fusion: false
  multi-latent-attention: false
  split: "1000,0,0"

  num-layers-at-start-in-bf16: 1
  num-layers-at-end-in-bf16: 1
