from: gptoss-20b
config:
  num-gpus: 2

  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 1
  num-layers-per-virtual-pipeline-stage: null

  micro-batch-size: 1
  global-batch-size: 2

  num-layers: 4
  hidden-size: 512
  ffn-hidden-size: 512
  seq-length: 64
  max-position-embeddings: 64

  num-attention-heads: 8
  num-query-groups: 2

  moe-ffn-hidden-size: 512

  overlap-grad-reduce: false
  overlap-param-gather: false
