datacenter:
  cluster:
    num_nodes: 8
  node:
    gpus_per_node: 8
    gpu: h100
  network:
    scale_up:
      switch:
        port_speed: 7200Gbps
        latency: 0.000025ms
    scale_out:
      nic:
        speed: 400Gbps
        latency: 0.005ms
      topology:
        type: fat_tree
        params:
          k: 8

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload:
  framework: megatron
  config:
    tensor-model-parallel-size: 1
    pipeline-model-parallel-size: 4
    expert-model-parallel-size: 8
    overlap-grad-reduce: true
    overlap-param-gather: true
    num-layers: 36
    hidden-size: 2880
    ffn-hidden-size: 2880
    num-attention-heads: 64
    num-query-groups: 8
    vocab-size: 201088
    swiglu: true
    position-embedding-type: rope
    rotary-base: 150000
    group-query-attention: true
    kv-channels: 64
    attention-softmax-in-fp32: false
    window-size: "127,0"
    window-attn-skip-freq: "[1,0]*18"
    num-experts: 128
    moe-router-topk: 4
    moe-token-dispatcher-type: alltoall
    moe-grouped-gemm: true
    moe-permute-fusion: true
    moe-ffn-hidden-size: 2880
    moe-layer-freq: 1
    moe-aux-loss-coeff: 0.01
    bf16: true
    fp16: false
    disable-bias-linear: true
    no-bias-dropout-fusion: true
    no-rope-fusion: true
    gradient-accumulation-fusion: false
    multi-latent-attention: false
    hidden-dropout: 0.0
    attention-dropout: 0.0
    micro-batch-size: 1
    global-batch-size: 1280
    seq-length: 4096
    max-position-embeddings: 4096
    num-gpus: 64
    distributed-optimizer: true
    mock-data: true
