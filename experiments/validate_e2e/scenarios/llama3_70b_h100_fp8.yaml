datacenter:
  datacenter:
    name: dgx-h100-64gpu
  cluster:
    num_nodes: 8
  node:
    gpus_per_node: 8
    gpu:
      from: h100
      cost:
        value: 25000
        min: 20000
        max: 32000
  network:
    scale_up:
      switch:
        port_speed: 7200Gbps
        latency: 0.000025ms
    scale_out:
      nic:
        speed: 400Gbps
        latency: 0.005ms
      topology:
        type: fat_tree
        params:
          k: 8

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload: experiments/validate_e2e/scenarios/llama70b_workload_64.yaml
