framework: megatron
config:
  num-gpus: 16
  disable-bias-linear: true

  expert-model-parallel-size: 8
  expert-tensor-parallel-size: 1
  cross-entropy-fusion-impl: te
  num-layers: 52
  hidden-size: 2688
  num-attention-heads: 32
  attention-backend: fused
  num-query-groups: 2
  ffn-hidden-size: 1856
  kv-channels: 128
  num-experts: 128
  init-method-std: 0.0173
  attention-softmax-in-fp32: false
  use-fused-weighted-squared-relu: true
  recompute-granularity: selective
  recompute-modules:
    - moe
    - layernorm 
    - core_attn 
    - moe_act
  first-last-layers-bf16: true
  moe-shared-expert-intermediate-size: 3712
  moe-ffn-hidden-size: 1856
  moe-router-topk: 6
  moe-router-num-groups: 1
  moe-router-group-topk: 1
  moe-router-topk-scaling-factor: 2.5
  moe-router-score-function: sigmoid
  moe-router-dtype: fp32
  moe-router-enable-expert-bias: true
  moe-grouped-gemm: true
  moe-aux-loss-coeff: 0.0001
  moe-token-dispatcher-type: alltoall
  moe-flex-dispatcher-backend: hybridep
  moe-permute-fusion: true
  cuda-graph-impl: transformer_engine
  cuda-graph-scope: mamba
  is-hybrid-model: true
  mamba-num-heads: 64
  hybrid-layer-pattern: MEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEM*EMEMEMEM*EMEMEMEME
  bf16: true
  grad-reduce-in-bf16: false
  fp8-format: hybrid
  fp8-param-gather: true
  num-layers-at-start-in-bf16: 1
  num-layers-at-end-in-bf16: 1
  lr: 0.0016
  min-lr: 1.6e-05
  adam-beta2: 0.95
  use-distributed-optimizer: true
  overlap-grad-reduce: true
  overlap-param-gather: true
  data-parallel-sharding-strategy: optim_grads_params
  micro-batch-size: 1
  global-batch-size: 1024
  override-opt_param-scheduler: true
  num-workers: 8
  seed: 1234
  seq-length: 8192
  split: 1000,0,0
  mmap-bin-files: false
  reset-position-ids: false
  reset-attention-mask: false
  eod-mask-loss: false
  tokenizer-type: HuggingFaceTokenizer
  tokenizer-model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  fp8-recipe: tensorwise
  mock-data: true
