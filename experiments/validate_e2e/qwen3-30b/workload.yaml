framework: megatron
config:
  num-gpus: 16
  disable-bias-linear: false
  no-bias-dropout-fusion: true
  swiglu: true

  expert-model-parallel-size: 16
  expert-tensor-parallel-size: 1
  bf16: true
  cross-entropy-fusion-impl: te
  num-layers: 48
  hidden-size: 2048
  num-attention-heads: 32
  num-query-groups: 4
  ffn-hidden-size: 6144
  kv-channels: 128
  hidden-dropout: 0.0
  attention-dropout: 0.0
  norm-epsilon: 1.0e-06
  disable-bias-linear: false
  num-experts: 128
  normalization: RMSNorm
  qk-layernorm: true
  moe-ffn-hidden-size: 768
  moe-router-topk: 8
  moe-grouped-gemm: true
  moe-aux-loss-coeff: 0.001
  moe-token-dispatcher-type: alltoall
  moe-flex-dispatcher-backend: hybridep
  moe-permute-fusion: true
  moe-router-fusion: true
  moe-hybridep-num-sms: 32
  share-embeddings-and-output-weights: false
  position-embedding-type: rope
  rotary-base: 1000000
  seq-length: 4096
  vocab-size: 151936
  grad-reduce-in-bf16: false
  fp8-format: hybrid
  fp8-param-gather: true
  num-layers-at-start-in-bf16: 1
  num-layers-at-end-in-bf16: 1
  lr: 0.0003
  min-lr: 3.0e-05
  adam-beta2: 0.95
  use-distributed-optimizer: true
  overlap-grad-reduce: true
  overlap-param-gather: true
  data-parallel-sharding-strategy: optim_grads_params
  micro-batch-size: 1
  global-batch-size: 1024
  manual-gc: true
  manual-gc-interval: 100
  override-opt_param-scheduler: true
  num-workers: 8
  seed: 1234
  split: 1000,0,0
  reset-position-ids: false
  reset-attention-mask: false
  eod-mask-loss: false
  tokenizer-type: HuggingFaceTokenizer
  tokenizer-model: Qwen/Qwen3-30B-A3B
  fp8-recipe: tensorwise
  mock-data: true
