# DeepSeek-V3 (671B MoE) training scenario — 1024 H100 GPUs
#
# Parallelism: TP=2, PP=16, EP=64, DP=8
# Total GPUs:  2 × 16 × 64 × 8 = 1024  (128 nodes × 8 GPUs/node)
# Recommended parallelism from NVIDIA Megatron-Bridge recipe.
#
# This uses the trace-driven path (framework: megatron).
#
# Network: H100 cluster
#   Scale-up:  NVLink → port_speed = 7200 Gbps
#   Scale-out: 400 Gbps InfiniBand, fat-tree

datacenter:
  datacenter:
    name: dgx-h100-1024gpu
  cluster:
    num_nodes: 128
  node:
    gpus_per_node: 8
    gpu: h100
  network:
    scale_up:
      switch:
        port_speed: 7200Gbps
        latency: 0.000025ms
    scale_out:
      nic:
        speed: 400Gbps
        latency: 0.005ms
      topology:
        type: fat_tree
        params:
          k: 8

collective:
  library: nccl
  algorithm: ring
  num_channels: 1

workload:
  framework: megatron
  config:
    # Parallelism
    tensor-model-parallel-size: 2
    pipeline-model-parallel-size: 16
    pipeline-model-parallel-layout: "Etttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tttt|tmL"
    expert-model-parallel-size: 64
    expert-tensor-parallel-size: 1
    sequence-parallel: true
    overlap-grad-reduce: true
    overlap-param-gather: true

    # Model architecture (DeepSeek V3 671B)
    num-layers: 61
    hidden-size: 7168
    ffn-hidden-size: 18432
    num-attention-heads: 128
    num-query-groups: 128
    vocab-size: 129280
    swiglu: true

    # Position / attention (MLA)
    position-embedding-type: rope
    rotary-base: 10000
    rotary-scaling-factor: 40
    group-query-attention: false
    multi-latent-attention: true
    kv-channels: 128
    attention-softmax-in-fp32: false

    # MoE
    num-experts: 256
    moe-router-topk: 8
    moe-token-dispatcher-type: alltoall
    moe-grouped-gemm: true
    moe-permute-fusion: true
    moe-ffn-hidden-size: 2048
    moe-layer-freq: 1
    moe-aux-loss-coeff: 0.0001

    # MTP (Multi-Token Prediction)
    mtp-num-layers: 1
    mtp-loss-scaling-factor: 0.1

    # Precision (FP8)
    bf16: true
    fp16: false
    fp8-format: hybrid
    fp8-recipe: tensorwise

    # Transformer Engine
    transformer-impl: transformer_engine
    attention-backend: flash
    cross-entropy-loss-fusion: true

    # Fusion / kernels
    disable-bias-linear: true
    no-bias-dropout-fusion: true
    no-rope-fusion: true
    gradient-accumulation-fusion: false
    moe-router-fusion: false

    # Dropout (disabled)
    hidden-dropout: 0.0
    attention-dropout: 0.0

    # Model init
    init-method-std: 0.006

    # Training shape
    micro-batch-size: 1
    global-batch-size: 4096
    seq-length: 4096
    max-position-embeddings: 4096
    num-gpus: 1024
    distributed-optimizer: true

    mock-data: true
    split: "1000,0,0"
