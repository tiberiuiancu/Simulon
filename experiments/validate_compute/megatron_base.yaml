# Megatron-LM base config for compute-validation MoE model
# Single GPU profiling run: 5 warmup iterations + 1 profiled iteration

# Model architecture
num-layers: 12
hidden-size: 2048
num-attention-heads: 32
ffn-hidden-size: 8192
vocab-size: 32000
num-query-groups: 32
position-embedding-type: rope
max-position-embeddings: 4096
swiglu: true
disable-bias-linear: true
no-bias-swiglu-fusion: true

# MoE
num-experts: 8
moe-router-topk: 2

# Parallelism (single GPU)
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 1

# Training
micro-batch-size: 1
global-batch-size: 1
seq-length: 4096
train-iters: 6
lr: 3.0e-4
min-lr: 3.0e-5
lr-decay-iters: 6
lr-warmup-fraction: 0.0
bf16: true

# Profiling
profile: true
use-pytorch-profiler: true
profile-step-start: 5
profile-step-end: 6
tensorboard-dir: ./tensorboard

# Logging / checkpoints
log-interval: 1
save-interval: 100000
eval-interval: 100000
eval-iters: 0
tokenizer-type: GPT2BPETokenizer
