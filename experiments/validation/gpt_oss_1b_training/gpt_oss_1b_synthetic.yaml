# Megatron-LM pretrain arguments for GPT-OSS-1B-MoE on synthetic data
# Single GPU profiling run: 5 warmup iterations + 1 profiled iteration
# Use underscore keys; Megatron's YAML loader does not convert hyphens to underscores.

# Model architecture
num_layers: 6
hidden_size: 1536
num_attention_heads: 24
ffn_hidden_size: 6144
vocab_size: 32000
num_query_groups: 24
position_embedding_type: rope
max_position_embeddings: 8192
swiglu: True
add_bias_linear: False
bias_swiglu_fusion: False

# MoE
num_experts: 8
moe_router_topk: 2

# Parallelism (single GPU)
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
expert_model_parallel_size: 1

# Training
micro_batch_size: 1
global_batch_size: 1
seq_length: 8192
train_iters: 6
lr: 6.0e-4
min_lr: 6.0e-5
lr_decay_iters: 6
lr_warmup_fraction: 0.0
bf16: True

# Data
mock_data: True

# Profiling
profile: True
use_pytorch_profiler: True
profile_step_start: 5
profile_step_end: 6
tensorboard_dir: ./tensorboard

# Logging / checkpoints
log_interval: 1
save_interval: 100000
eval_interval: 100000
eval_iters: 0
tokenizer_type: GPT2BPETokenizer
