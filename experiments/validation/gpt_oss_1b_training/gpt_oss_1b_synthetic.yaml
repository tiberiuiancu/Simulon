# Megatron-LM pretrain arguments for GPT-OSS-1B-MoE on synthetic data
# Single GPU profiling run: 5 warmup iterations + 1 profiled iteration

# Model architecture
num-layers: 6
hidden-size: 1536
num-attention-heads: 24
ffn-hidden-size: 6144
vocab-size: 32000
num-query-groups: 24
position-embedding-type: rope
max-position-embeddings: 8192
swiglu: true
add-bias-linear: false
bias-swiglu-fusion: false

# MoE
num-experts: 8
moe-router-topk: 2

# Parallelism (single GPU)
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 1

# Training
micro-batch-size: 1
global-batch-size: 1
seq-length: 8192
train-iters: 6
lr: 6.0e-4
min-lr: 6.0e-5
lr-decay-iters: 6
lr-warmup-fraction: 0.0
bf16: true

# Data
mock-data: true

# Profiling
profile: true
use-pytorch-profiler: true
profile-step-start: 5
profile-step-end: 6
tensorboard-dir: ./tensorboard

# Logging / checkpoints
log-interval: 1
save-interval: 100000
eval-interval: 100000
eval-iters: 0
tokenizer-type: GPT2BPETokenizer
