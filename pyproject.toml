[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulon"
version = "0.1.0"
description = "AI cluster simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=2.4.4",
    "matplotlib>=3.10.8",
    "seaborn",
    "mlflow>=2.0",
    "wandb",
    "pybind11>=2.12",
    "setuptools",
]

[project.scripts]
simulon = "simulon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["simulon"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pre-commit>=4.0",
    "datasets",
    "transformers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ICN",
    "T20",
]
ignore = ["E501", "W505"]

[tool.ruff.lint.per-file-ignores]
"simulon/cli/*.py" = ["B008"]
"simulon/**/*.py" = ["N"]
"tests/**/*.py" = ["N"]
"experiments/**/plot.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["simulon"]
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
