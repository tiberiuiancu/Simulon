framework: megatron
model:
  name: llama-7b
  hidden_size: 256
  num_layers: 2
  num_heads: 4
  ffn_hidden_size: 1024
  vocab_size: 32000
  swiglu: true
parallelism:
  tp: 2
  pp: 2
  ep: 1
  dp: 2
  num_microbatches: 4
  pipeline_schedule: 1f1b
training:
  num_gpus: 8
  global_batch_size: 8
  micro_batch_size: 1
  sequence_length: 1024
  dtype: bf16
  flash_attention: false
  iterations: 1
