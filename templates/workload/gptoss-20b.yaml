framework: megatron
config:
  num-gpus: 16
  tokenizer-type: Llama3Tokenizer
  tokenizer-model: NousResearch/Meta-Llama-3.1-8B
  mock-data: true
  vocab-size: 128256
  padded-vocab-size: 128256

  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 2
  expert-model-parallel-size: 8
  context-parallel-size: 1

  micro-batch-size: 1
  global-batch-size: 16
  lr: 0.0004
  seed: 1234

  num-layers: 36
  hidden-size: 2880
  ffn-hidden-size: 2880
  init-method-std: 0.02
  seq-length: 4096
  kv-channels: 64
  max-position-embeddings: 4096
  swiglu: true

  num-attention-heads: 64
  num-query-groups: 8
  group-query-attention: true
  attention-softmax-in-fp32: false
  use-flash-attn: true
  attention-backend: flash

  position-embedding-type: rope
  rotary-base: 150000
  rotary-percent: 1.0
  untie-embeddings-and-output-weights: true

  normalization: RMSNorm
  norm-epsilon: 1.e-5
  bf16: true
  fp16: false

  attention-dropout: 0.0
  hidden-dropout: 0.0

  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  adam-eps: 1.e-8
  clip-grad: 1.0
  weight-decay: 0.05

  min-lr: 0.00004
  lr-decay-style: cosine
  lr-warmup-iters: 128

  recompute-activations: false
  use-torch-fsdp2: false

  use-distributed-optimizer: true
  overlap-grad-reduce: true
  overlap-param-gather: true

  distributed-backend: nccl
  distributed-timeout-minutes: 30
  eval-interval: 999
  eval-iters: 0

  num-experts: 128
  moe-router-topk: 4
  moe-token-dispatcher-type: alltoall
  moe-grouped-gemm: true
  moe-permute-fusion: true
  moe-ffn-hidden-size: 2880
  moe-layer-freq: 1
  moe-aux-loss-coeff: 0.0

  window-size: "127,0"
  window-attn-skip-freq: "[1,0]*18"

  disable-bias-linear: true
  no-bias-dropout-fusion: true
  no-rope-fusion: true
  gradient-accumulation-fusion: false
  multi-latent-attention: false
  split: "1000,0,0"

  num-layers-at-start-in-bf16: 1
  num-layers-at-end-in-bf16: 1
