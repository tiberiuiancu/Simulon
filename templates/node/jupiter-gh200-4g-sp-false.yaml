# Jupiter GH200 node — same hardware as jupiter-gh200-4g but traces captured without sequence-parallel
name: jupiter-gh200-4g-sp-false
gpus_per_node: 4
gpu: gh200_jupiter-sp-false
scale_out:
  nic:
    speed: 200Gbps
    latency: 0.005ms
  topology:
    type: fat_tree
    params:
      k: 8

scale_up:
  switch:
    port_speed: 2554Gbps
    latency: 0.000025ms

nccl:
  name: jupiter-gh200-4g
  gpus_per_node: 4
  # Per-call collective overhead. Set to 0: the previous 0.111ms was a fit-to-residual
  # ((SP=True gap − SP=False gap)/call-count) — a magic number tuned to the very gap it
  # was meant to validate, so it is removed. A real per-call latency floor must be
  # MEASURED (small-message nccl-tests, y-intercept of time-vs-size), not back-derived.
  # Any residual is reported as honest model error, not absorbed here.
  launch_latency_ms: 0.0
  AllReduce:
    ring:
      - {size_bytes:       8388608, bus_bw_GBps: 204.795}
