# Jupiter GH200 node (real NCCL measurements from nccl-tests on jpbo-048-38)
# Hardware: GH200 120GB, NVLink 4.0, quad-rail InfiniBand
# Source: experiments/validate_simccl/results/nccl_*.json.0 (1-node run, job 537473)
name: jupiter-gh200-4g
gpus_per_node: 4
gpu: gh200_jupiter
# Per-op host cost for the two-resource replay. Calibrated on this cluster's own trace
# CAPTURE runs (experiments/host_cost_transfer.py): each capture independently implies
# 22.7-29.5 us/op across PP2/PP4/PP8, plain and interleaved layouts, bf16 and fp8
# (mean 27.0, sd 9%), so it behaves as a machine property rather than a per-config fit.
# 26.0 is the value the clean anchors jointly solve to. Replaces the deleted
# launch_latency_ms, which was fitted to a residual and did not hold across mbs.
host_cost_us: 26.0
scale_out:
  nic:
    speed: 200Gbps
    latency: 0.005ms
  topology:
    type: fat_tree
    params:
      k: 8

scale_up:
  switch:
    port_speed: 2554Gbps # taken from snellius yaml
    latency: 0.000025ms # taken from snellius yaml

nccl:
  name: jupiter-gh200-4g
  gpus_per_node: 4
  # Fixed per-collective cost on top of the bandwidth-limited transfer, for a 4-rank
  # (full-node) communicator. This is RANK-SKEW EXPOSURE, not launch overhead: a
  # collective cannot complete until every participant arrives, and in real training the
  # ranks are not synchronised, so the wait shows up as idle on early ranks and as
  # inflated NCCL kernel time on late ones.
  #
  # HONEST STATUS OF THESE NUMBERS — read before trusting them.
  # The FUNCTIONAL FORM (cost per collective, scaling with communicator size) is validated:
  # tp2pp1 and tp2pp2 have the SAME 128 microbatches but 15626 vs 8201 collectives, and the
  # lost time tracked the collective count (x0.53 vs x0.56), refuting a per-microbatch law
  # by 1.78x. nsys also observes the mechanism directly (jobs 1140757/1141312/1144045:
  # extreme per-GPU imbalance, one rank 98.6% busy inside NCCL while another idles 58%,
  # AllReduce max 750 ms against a 213 us median).
  # The MAGNITUDES were first obtained by residual — (physical - modelled compute - modelled
  # comm) / n_coll — which is a fit. They are now CORROBORATED BY DIRECT MEASUREMENT of the
  # same physical quantity, from NCCL kernel start timestamps alone (no compute model, no
  # comm model, no physical-vs-simulated comparison): mean over collectives of
  # (latest rank's start - earliest rank's start). Regenerate with
  #     python experiments/measure_skew.py <nsys.sqlite> --groups 0,1 2,3
  #
  #   size | calibrated (this file) | directly measured arrival spread
  #     2  |        0.538 ms        | 0.667 / 0.435 (tp2pp2), 0.645 (tp2pp1)  -> mean 0.582
  #     4  |        0.911 ms        | >1.133 (measured over 3 of 4 ranks = a lower bound)
  #
  # The calibrated values sit just BELOW the raw spread, which is the expected relationship:
  # part of the wait overlaps the collective's own transfer, so only a fraction is exposed.
  # The 2-rank spread itself varies 0.435-0.667 across groups within a single run, so ~+-20%
  # is the intrinsic precision available here — do not chase a tighter number.
  #
  # SCOPE: sizes 2 and 4 only, both intra-node, and ONE model (Qwen3-1.7B). This top-level
  # value doubles as the fallback for unmeasured communicators including multi-node, where it
  # is an UNVALIDATED LOWER BOUND (skew grows with participant count). Current exposure is
  # small — the 32B traces carry only ~2 collectives above 4 ranks per rank-trace — but
  # re-measure before a multi-node sweep, and before a large change in model size or
  # sequence length (skew plausibly depends on the work between sync points).
  #
  # !!! k IS NOT A CONSTANT — IT DECLINES WITH MICROBATCH SIZE. DO NOT SWEEP mbs ON IT. !!!
  # Settled 2026-08-01 by the out-of-sample cell tp4pp1-mbs2 (physical job 1148929, nsys
  # profile 1196684). Two independent routes agree that the 4-rank per-collective cost falls
  # ~25% from mbs1 to mbs2:
  #     direct arrival spread   1132 us (mbs1) -> 888 us (mbs2)   -22%   [timestamps only]
  #     residual lost/collective 973 us (mbs1) -> 720 us (mbs2)   -26%   [iteration - compute]
  # The per-collective FORM survives (lost time still scales with collective count); it is
  # this COEFFICIENT that moves. So no single value works:
  #     k=0.911 -> mbs1  +0.0%, mbs2 +25.0%
  #     k=0.720 -> mbs1 -14.0%, mbs2 +11.9%
  # 0.911 is kept because it is the mbs1-calibrated value and keeps the published scorecard
  # reproducible; it OVER-predicts as mbs grows. Same direction as the 2-rank data
  # (538 us at mbs1 -> 372 us at mbs8), so the 2-rank value has the same weakness — it was
  # simply calibrated at small mbs. Modelling k as a function of work-per-collective is the
  # open task; until then, treat any mbs sweep at TP>=2 as uncalibrated.
  AllReduce:
    ring:
      - {size_bytes:       8388608, bus_bw_GBps: 204.795}
      - {size_bytes:      16777216, bus_bw_GBps: 248.022}
      - {size_bytes:      33554432, bus_bw_GBps: 279.992}
