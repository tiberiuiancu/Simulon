# Jupiter GH200 node (real NCCL measurements from nccl-tests on jpbo-048-38)
# Hardware: GH200 120GB, NVLink 4.0, quad-rail InfiniBand
# Source: experiments/validate_simccl/results/nccl_*.json.0 (1-node run, job 537473)
name: jupiter-gh200-4g
gpus_per_node: 4
gpu: gh200_jupiter
scale_out:
  nic:
    speed: 200Gbps
    latency: 0.005ms
  topology:
    type: fat_tree
    params:
      k: 8

scale_up:
  switch:
    port_speed: 2554Gbps # taken from snellius yaml
    latency: 0.000025ms # taken from snellius yaml

nccl:
  name: jupiter-gh200-4g
  gpus_per_node: 4
  # Per-call overhead beyond nccl-tests tight-loop bandwidth.
  # Derived from: (SP=True gap − SP=False gap) / (8226 − 2066 calls) = 686ms / 6160 = 0.111ms.
  # Accounts for Python/PyTorch dispatch + CUDA launch overhead not captured in nccl-tests.
  launch_latency_ms: 0.111
