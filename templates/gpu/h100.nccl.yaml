# H100 SXM5 — default intra-node measurements (derived from SimAI nvlink_ratio.csv)
# Peak: SM90_NVLINK_BW x H100_NVLINKS = 20.6 x 18 = 370.8 GB/s
# Replace bus_bw_GBps with output from: nccl-tests allreduce_perf -b 8M -e 16G -f 2
gpus_per_node: 8

AllReduce:
  ring:
    - {size_bytes:    16777216, bus_bw_GBps: 166.9}   # 16 MB  (ratio 0.45)
    - {size_bytes:    33554432, bus_bw_GBps: 203.9}   # 32 MB  (ratio 0.55)
    - {size_bytes:    67108864, bus_bw_GBps: 241.0}   # 64 MB  (ratio 0.65)
    - {size_bytes:   134217728, bus_bw_GBps: 255.9}   # 128 MB (ratio 0.69)
    - {size_bytes:   268435456, bus_bw_GBps: 270.7}   # 256 MB (ratio 0.73)
    - {size_bytes:   536870912, bus_bw_GBps: 281.8}   # 512 MB (ratio 0.76)
    - {size_bytes:  1073741824, bus_bw_GBps: 285.5}   # 1 GB   (ratio 0.77)
    - {size_bytes:  2147483648, bus_bw_GBps: 289.2}   # 2 GB   (ratio 0.78)
    - {size_bytes:  4294967296, bus_bw_GBps: 292.9}   # 4 GB   (ratio 0.79)
    - {size_bytes:  8589934592, bus_bw_GBps: 296.6}   # 8 GB   (ratio 0.80)
    - {size_bytes: 17179869184, bus_bw_GBps: 300.3}   # 16 GB  (ratio 0.81)
  # nvls: fill in from: NCCL_ALGO=NVLS nccl-tests allreduce_perf -b 8M -e 16G -f 2

